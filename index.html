<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Boyd | Elite Advertising Suite</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- GOOGLE ADSENSE INTEGRATION -->
    <!-- Reemplaza el ID 'ca-pub-XXXXXXXXXXXXXXXX' con tu propio ID de AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
</head>
<body class="theme-fm">
    <div class="glow-bg"></div>
    
    <div class="app-container">
        <header>
            <div class="logo-container">
                <img src="assets/logo.png" alt="Radio Boyd Logo" id="app-logo" class="main-logo">
                <div class="logo-text-fallback">
                    <span class="logo-radio">RADIO</span>
                    <span class="logo-boyd">BOYD</span>
                </div>
            </div>
            <div class="header-meta">
                <div class="country-selector">
                    <select id="select-country">
                        <option value="">Cargando países...</option>
                    </select>
                </div>
                <div class="platform-switch">
                    <button id="mode-ms" class="mode-btn active">Microsoft Edition</button>
                    <button id="mode-hw" class="mode-btn">Huawei Edition</button>
                </div>
                <div class="meta-info">
                    <span class="status-indicator">● LIVE</span>
                    <span id="current-time">00:00:00</span>
                </div>
            </div>
        </header>

        <main>
            <section class="broadcast-panel">
                <div class="station-toggle">
                    <button id="btn-am" class="toggle-btn">AM</button>
                    <button id="btn-fm" class="toggle-btn active">FM</button>
                </div>

                <div class="visualizer-container">
                    <div class="dial-controls">
                        <button class="dial-btn" id="dial-prev">◀</button>
                        <div class="station-info">
                            <h1 id="freq-display">104.5</h1>
                            <span id="station-label">FM STEREO • HIGH FIDELITY</span>
                        </div>
                        <button class="dial-btn" id="dial-next">▶</button>
                    </div>
                    <div class="bars" id="visualizer">
                        <!-- Dynamic bars will be added by JS -->
                    </div>
                </div>
            </section>

            <section class="ads-panel">
                <div class="panel-header">
                    <h2>GESTIÓN DE PUBLICIDAD</h2>
                    <button class="btn-add">+ Nueva Campaña</button>
                </div>

                <div class="ads-list" id="ads-container">
                    <!-- CONTENEDOR PARA MICROSOFT STORE ADS -->
                    <div id="ms-ad-zone" class="ad-zone-placeholder">
                        <p>Microsoft Store Ad Unit</p>
                    </div>

                    <!-- CONTENEDOR PARA GOOGLE ADSENSE (WEB) -->
                    <ins class="adsbygoogle"
                         style="display:block"
                         data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
                         data-ad-slot="XXXXXXXXXX"
                         data-ad-format="auto"
                         data-full-width-responsive="true"></ins>
                    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
                </div>

                <div id="huawei-ad-banner" class="hw-banner-container hidden">
                    <!-- CONTENEDOR PARA HUAWEI ADS SDK -->
                    <div class="hw-ad-tag">Huawei Ads</div>
                    <div id="hw-ad-unit" class="hw-unit-placeholder">
                        <p>HMS Ad Unit</p>
                    </div>
                </div>

                <div class="explorer-header">
                    <h2>EXPLORADOR DE EMISORAS</h2>
                </div>
                <div class="stations-explorer" id="stations-list">
                    <p class="placeholder-text">Selecciona un país para ver emisoras...</p>
                </div>
            </section>
        </main>

        <footer>
            <div class="player-controls">
                <button class="control-btn" id="play-btn">▶</button>
                <div class="track-info">
                    <span class="now-playing">REPRODUCIENDO AHORA</span>
                    <marquee id="current-track">Publicidad: Nike Air Max - New Season Launch...</marquee>
                </div>
            </div>
            <div class="volume-control">
                <button class="vol-btn" id="vol-down">−</button>
                <input type="range" id="volume-slider" min="0" max="100" value="80">
                <button class="vol-btn" id="vol-up">+</button>
            </div>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Boyd | FINAL VERSION</title>
    <style>
        :root {
            --bg-dark: #050508;
            --surface: rgba(255, 255, 255, 0.03);
            --surface-border: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --fm-color: #00f2ff;
            --fm-glow: rgba(0, 242, 255, 0.3);
            --am-color: #ff9d00;
            --am-glow: rgba(255, 157, 0, 0.3);
            --active-color: var(--fm-color);
            --active-glow: var(--fm-glow);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg-dark); color: var(--text-primary); font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        .glow-bg { position: fixed; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle at center, var(--active-glow) 0%, transparent 40%); z-index: -1; transition: background 0.8s ease; }
        .app-container { width: 95vw; height: 90vh; max-height: 800px; background: rgba(10, 10, 15, 0.7); backdrop-filter: blur(20px); border: 1px solid var(--surface-border); border-radius: 30px; display: grid; grid-template-rows: auto 1fr auto; padding: 30px; box-shadow: 0 50px 100px rgba(0,0,0,0.5); overflow: hidden; }
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid var(--surface-border); }
        .main-logo { height: 80px; filter: drop-shadow(0 0 15px var(--active-glow)); transition: all 0.5s; }
        .header-meta { display: flex; align-items: center; gap: 20px; }
        #select-country { background: rgba(255,255,255,0.05); border: 1px solid var(--surface-border); color: #fff; padding: 8px; border-radius: 8px; width: 180px; }
        main { display: grid; grid-template-columns: 1fr 350px; gap: 20px; padding: 20px 0; overflow: hidden; }
        .broadcast-panel { background: var(--surface); border-radius: 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; }
        .station-toggle { position: absolute; top: 20px; left: 20px; display: flex; background: rgba(255,255,255,0.05); border-radius: 10px; padding: 4px; }
        .toggle-btn { background: transparent; border: none; color: #666; padding: 8px 20px; cursor: pointer; border-radius: 6px; font-weight: bold; }
        .toggle-btn.active { background: var(--active-color); color: #000; box-shadow: 0 0 15px var(--active-glow); }
        .station-info h1 { font-size: 80px; color: var(--active-color); text-shadow: 0 0 20px var(--active-glow); text-align: center; }
        .station-info span { display: block; text-align: center; font-size: 12px; color: #666; letter-spacing: 4px; }
        .ads-panel { background: var(--surface); border-radius: 20px; padding: 20px; overflow-y: auto; }
        .station-item { padding: 15px; background: rgba(255,255,255,0.03); border-radius: 10px; margin-bottom: 10px; cursor: pointer; border: 1px solid transparent; transition: 0.3s; }
        .station-item:hover { border-color: var(--active-color); background: rgba(255,255,255,0.06); }
        .station-name { font-weight: bold; }
        .bars { display: flex; gap: 4px; align-items: flex-end; height: 100px; margin-top: 30px; }
        .bar { width: 6px; background: var(--active-color); border-radius: 3px; box-shadow: 0 0 10px var(--active-glow); }
        footer { padding-top: 20px; border-top: 1px solid var(--surface-border); display: flex; justify-content: space-between; align-items: center; }
        .control-btn { width: 60px; height: 60px; border-radius: 50%; background: var(--active-color); border: none; font-size: 24px; cursor: pointer; box-shadow: 0 0 20px var(--active-glow); }
        .am-filter { filter: sepia(0.5) contrast(1.2); }
        .crackling-noise { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0; background: url('https://media.giphy.com/media/oEI9uWUiclsRTlA8Is/giphy.gif'); mix-blend-mode: overlay; }
        body.theme-am .crackling-noise { opacity: 0.05; }
    </style>
</head>
<body class="theme-fm">
    <div class="glow-bg"></div>
    <div class="crackling-noise"></div>
    <div class="app-container">
        <header>
            <img src="assets/logo.png" class="main-logo" alt="Logo">
            <div class="header-meta">
                <select id="select-country"><option value="">Selecciona País</option></select>
                <div id="current-time">00:00:00</div>
            </div>
        </header>
        <main>
            <section class="broadcast-panel">
                <div class="station-toggle">
                    <button id="btn-am" class="toggle-btn">AM</button>
                    <button id="btn-fm" class="toggle-btn active">FM</button>
                </div>
                <div class="station-info">
                    <h1 id="freq-display">104.5</h1>
                    <span id="station-label">FM STEREO • HIGH FIDELITY</span>
                </div>
                <div class="bars" id="visualizer"></div>
            </section>
            <section class="ads-panel">
                <h2 style="font-size: 12px; margin-bottom: 15px;">EXPLORADOR DE EMISORAS</h2>
                <div id="stations-list"></div>
                <div id="ads-container" style="margin-top: 20px;">
                    <div style="padding: 20px; background: rgba(0,120,212,0.1); border-left: 4px solid #0078d4; border-radius: 8px;">
                        <h3 style="font-size: 14px;">Microsoft Store</h3>
                        <p style="font-size: 11px; color: #aaa;">Versión Certificada</p>
                    </div>
                </div>
            </section>
        </main>
        <footer>
            <div style="display: flex; align-items: center; gap: 20px;">
                <button id="play-btn" class="control-btn">▶</button>
                <div><span style="font-size: 10px; color: var(--active-color);">RADIO BOYD PRO</span><br><b>STREAMING LIVE</b></div>
            </div>
            <div style="display: flex; align-items: center; gap: 10px;">
                <span>VOL</span>
                <input type="range" id="volume-slider" min="0" max="100" value="80">
            </div>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const playBtn = document.getElementById('play-btn');
            const freqDisplay = document.getElementById('freq-display');
            const stationLabel = document.getElementById('station-label');
            const volSlider = document.getElementById('volume-slider');
            const countrySelect = document.getElementById('select-country');
            const stationsContainer = document.getElementById('stations-list');
            const visualizer = document.getElementById('visualizer');
            const btnAM = document.getElementById('btn-am');
            const btnFM = document.getElementById('btn-fm');

            let isPlaying = false;
            let isAM = false;
            const stationAudio = new Audio();
            stationAudio.crossOrigin = "anonymous";

            const FALLBACK_STATIONS = [
                { name: "Radio Paradise", url: "https://stream.radioparadise.com/mp3_128" },
                { name: "SomaFM Groove Salad", url: "https://ice1.somafm.com/groovesalad-128-mp3" },
                { name: "Classic FM", url: "https://media-ice.musicradio.com/ClassicFMMP3" }
            ];

            function renderDefault() {
                stationsContainer.innerHTML = '';
                FALLBACK_STATIONS.forEach(s => {
                    const item = document.createElement('div');
                    item.className = 'station-item';
                    item.innerHTML = `<div class="station-name">${s.name}</div><div style="font-size:10px; color:#666;">Señal OK</div>`;
                    item.addEventListener('click', () => {
                        stationAudio.src = s.url;
                        stationLabel.textContent = s.name;
                        freqDisplay.textContent = "WEB";
                        isPlaying = false;
                        togglePlay();
                    });
                    stationsContainer.appendChild(item);
                });
            }

            function togglePlay() {
                if (!isPlaying) {
                    stationAudio.play().then(() => {
                        isPlaying = true;
                        playBtn.textContent = '⏸';
                        animateBars();
                    }).catch(() => { alert("Haz clic en cualquier parte y luego en Play."); });
                } else {
                    stationAudio.pause();
                    isPlaying = false;
                    playBtn.textContent = '▶';
                }
            }

            playBtn.addEventListener('click', togglePlay);
            volSlider.addEventListener('input', () => { stationAudio.volume = volSlider.value / 100; });

            btnAM.addEventListener('click', () => {
                isAM = true;
                btnAM.classList.add('active');
                btnFM.classList.remove('active');
                document.body.classList.add('theme-am');
                document.documentElement.style.setProperty('--active-color', 'var(--am-color)');
                document.documentElement.style.setProperty('--active-glow', 'var(--am-glow)');
                freqDisplay.textContent = "840";
                stationLabel.textContent = "AM ANALOG SIGNAL";
            });

            btnFM.addEventListener('click', () => {
                isAM = false;
                btnFM.classList.add('active');
                btnAM.classList.remove('active');
                document.body.classList.remove('theme-am');
                document.documentElement.style.setProperty('--active-color', 'var(--fm-color)');
                document.documentElement.style.setProperty('--active-glow', 'var(--fm-glow)');
                freqDisplay.textContent = "104.5";
                stationLabel.textContent = "FM STEREO HD";
            });

            function animateBars() {
                if (!isPlaying) return;
                if (visualizer.innerHTML === '') {
                    for (let i = 0; i < 20; i++) {
                        const bar = document.createElement('div');
                        bar.className = 'bar';
                        bar.style.height = '10%';
                        visualizer.appendChild(bar);
                    }
                }
                visualizer.querySelectorAll('.bar').forEach(b => { b.style.height = (Math.random() * 80 + 10) + '%'; });
                setTimeout(() => requestAnimationFrame(animateBars), 100);
            }

            // Countries
            const countries = [
                {n: "España", c: "ES"}, {n: "México", c: "MX"}, {n: "Argentina", c: "AR"}, {n: "USA", c: "US"}
            ];
            countries.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.c;
                opt.textContent = c.n;
                countrySelect.appendChild(opt);
            });

            countrySelect.addEventListener('change', (e) => {
                if (!e.target.value) return;
                stationsContainer.innerHTML = '<p>Sintonizando...</p>';
                fetch(`https://all.api.radio-browser.info/json/stations/bycountryexact/${e.target.value}?limit=20&hidebroken=true`)
                .then(r => r.json())
                .then(data => {
                    stationsContainer.innerHTML = '';
                    data.forEach(s => {
                        const item = document.createElement('div');
                        item.className = 'station-item';
                        item.innerHTML = `<div class="station-name">${s.name}</div>`;
                        item.addEventListener('click', () => {
                            stationAudio.src = s.url_resolved;
                            stationLabel.textContent = s.name;
                            isPlaying = false;
                            togglePlay();
                        });
                        stationsContainer.appendChild(item);
                    });
                });
            });

            renderDefault();
            setInterval(() => { document.getElementById('current-time').textContent = new Date().toLocaleTimeString(); }, 1000);
        });
    </script>
</body>
</html>

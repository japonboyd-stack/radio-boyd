<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Boyd | CLEAR VISION EDITION</title>
    <style>
        :root {
            --bg-dark: #020204;
            --surface: #0a0a0f;
            --surface-border: #1a1a25;
            --text-primary: #ffffff;
            --active-color: #00ff88;
            --active-glow: rgba(0, 255, 136, 0.5);
            --am-color: #ff9d00;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg-dark); color: var(--text-primary); font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        
        .app-container { width: 95vw; height: 90vh; max-height: 850px; background: #08080c; border: 2px solid var(--surface-border); border-radius: 40px; display: grid; grid-template-rows: auto 1fr auto; padding: 30px; box-shadow: 0 0 100px rgba(0,0,0,1); overflow: hidden; }
        
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid var(--surface-border); }
        .main-logo { height: 160px; filter: drop-shadow(0 0 30px var(--active-glow)); }
        
        /* SELECTOR MEJORADO PARA EVITAR CUADRO BLANCO */
        #select-country { 
            background: #111; 
            border: 1px solid #333; 
            color: #00ff88; 
            padding: 10px; 
            border-radius: 10px; 
            width: 280px; 
            font-family: 'Orbitron', sans-serif; 
            font-weight: bold;
            outline: none;
        }
        
        main { display: grid; grid-template-columns: 1fr 380px; gap: 30px; padding: 25px 0; overflow: hidden; }
        
        .broadcast-panel { background: #050508; border-radius: 30px; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; border: 1px solid #111; }
        .station-toggle { position: absolute; top: 20px; left: 20px; display: flex; background: #111; border-radius: 12px; padding: 3px; }
        .toggle-btn { background: transparent; border: none; color: #444; padding: 10px 20px; cursor: pointer; border-radius: 8px; font-weight: bold; font-family: 'Orbitron'; }
        .toggle-btn.active { background: var(--active-color); color: #000; box-shadow: 0 0 15px var(--active-glow); }
        
        .station-info h1 { font-size: 110px; color: var(--active-color); text-shadow: 0 0 40px var(--active-glow); text-align: center; font-family: 'Orbitron'; }
        
        .ads-panel { background: #050508; border-radius: 30px; padding: 20px; overflow-y: auto; border: 1px solid #111; }
        .station-item { padding: 15px; background: #0a0a0f; border-radius: 12px; margin-bottom: 10px; cursor: pointer; border: 1px solid #1a1a25; transition: 0.2s; }
        .station-item:hover { border-color: var(--active-color); background: #111; }
        .station-name { font-weight: bold; font-size: 15px; color: #fff; }
        
        .bars { display: flex; gap: 5px; align-items: flex-end; height: 100px; margin-top: 30px; }
        .bar { width: 8px; background: var(--active-color); border-radius: 4px; box-shadow: 0 0 10px var(--active-glow); }
        
        footer { padding-top: 20px; border-top: 1px solid var(--surface-border); display: flex; justify-content: space-between; align-items: center; }
        .control-btn { width: 70px; height: 70px; border-radius: 50%; background: var(--active-color); border: none; font-size: 28px; cursor: pointer; box-shadow: 0 0 30px var(--active-glow); display: flex; align-items: center; justify-content: center; }
        
        .status-msg { font-size: 10px; color: #00ff88; font-weight: bold; letter-spacing: 2px; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <img src="assets/logo.png" class="main-logo" alt="Logo">
            <div style="text-align: right;">
                <select id="select-country"><option value="">Sintonizando Países...</option></select>
                <div id="current-time" style="font-family: 'Orbitron'; font-size: 24px; color: #00ff88; margin-top: 10px;">00:00:00</div>
            </div>
        </header>
        <main>
            <section class="broadcast-panel">
                <div class="station-toggle">
                    <button id="btn-am" class="toggle-btn">AM</button>
                    <button id="btn-fm" class="toggle-btn active">FM</button>
                </div>
                <div class="station-info">
                    <h1 id="freq-display">104.5</h1>
                    <span style="opacity: 0.5; letter-spacing: 5px;">FM STEREO • HIGH DEFINITION</span>
                </div>
                <div class="bars" id="visualizer"></div>
            </section>
            <section class="ads-panel">
                <h2 style="font-size: 12px; margin-bottom: 15px; letter-spacing: 2px; color: #00ff88;">ESTACIONES DISPONIBLES</h2>
                <div id="stations-list"></div>
            </section>
        </main>
        <footer>
            <div style="display: flex; align-items: center; gap: 20px;">
                <button id="play-btn" class="control-btn">▶</button>
                <div>
                    <b style="font-size: 20px;">RADIO BOYD</b><br>
                    <span id="status-label" class="status-msg">LISTO</span>
                </div>
            </div>
            <div style="display: flex; align-items: center; gap: 15px;">
                <span style="font-size: 12px; opacity: 0.5;">VOL</span>
                <input type="range" id="volume-slider" min="0" max="100" value="80" style="width: 180px; accent-color: #00ff88;">
            </div>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const playBtn = document.getElementById('play-btn');
            const freqDisplay = document.getElementById('freq-display');
            const stationAudio = new Audio();
            const stationsList = document.getElementById('stations-list');
            const countrySelect = document.getElementById('select-country');
            const statusLabel = document.getElementById('status-label');
            const visualizer = document.getElementById('visualizer');
            
            let isPlaying = false;

            const FALLBACK = [{ name: "Radio Paradise", url: "https://stream.radioparadise.com/mp3_128" }];

            function render(data) {
                stationsList.innerHTML = '';
                const list = data || FALLBACK;
                list.forEach(s => {
                    const el = document.createElement('div');
                    el.className = 'station-item';
                    el.innerHTML = `<div class="station-name">${s.name}</div>`;
                    el.onclick = () => {
                        statusLabel.textContent = "CONECTANDO...";
                        stationAudio.src = s.url_resolved || s.url;
                        stationAudio.play().then(() => {
                            isPlaying = true;
                            playBtn.textContent = '⏸';
                            statusLabel.textContent = "AL AIRE";
                            animate();
                        }).catch(() => {
                            statusLabel.textContent = "ERROR: PRUEBA OTRA";
                        });
                    };
                    stationsList.appendChild(el);
                });
            }

            playBtn.onclick = () => {
                if (!isPlaying) {
                    if (!stationAudio.src) stationAudio.src = FALLBACK[0].url;
                    stationAudio.play().then(() => {
                        isPlaying = true;
                        playBtn.textContent = '⏸';
                        animate();
                    });
                } else {
                    stationAudio.pause();
                    isPlaying = false;
                    playBtn.textContent = '▶';
                }
            };

            fetch('https://de1.api.radio-browser.info/json/countries?order=name')
            .then(r => r.json())
            .then(countries => {
                countrySelect.innerHTML = '<option value="">Elige un País</option>';
                countries.forEach(c => {
                    if (c.stationcount > 10) {
                        const opt = document.createElement('option');
                        opt.value = c.iso_3166_1 || c.name;
                        opt.textContent = `${c.name} (${c.stationcount})`;
                        countrySelect.appendChild(opt);
                    }
                });
            });

            countrySelect.onchange = (e) => {
                const c = e.target.value;
                if (!c) return;
                stationsList.innerHTML = '<p style="padding:20px; opacity:0.5;">Buscando...</p>';
                fetch(`https://de1.api.radio-browser.info/json/stations/bycountryexact/${encodeURIComponent(c)}?limit=50&hidebroken=true&order=clickcount&reverse=true`)
                .then(r => r.json())
                .then(data => render(data.filter(s => (s.url_resolved || s.url).startsWith('https'))));
            };

            function animate() {
                if (!isPlaying) return;
                if (visualizer.innerHTML === '') {
                    for (let i = 0; i < 20; i++) {
                        const b = document.createElement('div');
                        b.className = 'bar';
                        visualizer.appendChild(b);
                    }
                }
                visualizer.querySelectorAll('.bar').forEach(b => b.style.height = (Math.random() * 80 + 20) + '%');
                setTimeout(() => requestAnimationFrame(animate), 100);
            }

            render();
            setInterval(() => { document.getElementById('current-time').textContent = new Date().toLocaleTimeString(); }, 1000);
        });
    </script>
</body>
</html>
